{{ define "main" }}
<div class="wrap">
  <h1 class="q">{{ .Title }}</h1>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  {{ range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}
  <section class="archive-year">
    <h2>{{ .Key }}</h2>
    <ul class="archive-list">
      {{ range .Pages }}
      <li>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
      {{ end }}
    </ul>
  </section>
  {{ end }}
</div>
{{ end }}
